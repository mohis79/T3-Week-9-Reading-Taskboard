BcDAW61mAJKOaMwEEALRbszaxG4ccO7zfZKzcKBmB0USNjLG52RaVkE8gRrWpDaTZaWIv4QdAAAAA=",story:["On Monday morning, Hana noticed something strange in the school garden. Ripe tomatoes were shrinking into green fruit, and fallen leaves were floating from the ground back onto their branches.","By lunchtime, the garden was moving faster. Flowers folded into buds. Long bean vines curled back around their stakes, and tiny seeds leapt from the soil into waiting pods.","Hana found a cracked green clock beneath the k\u016Bmara leaves. Its hands spun anticlockwise. Her friend Mika wanted to pull them off, but Hana stopped him. She remembered that forcing a broken mechanism could make the damage worse.","They searched the garden shed and found the clock\u2019s wooden case. Inside the lid were the words: TO RESTORE WHAT GROWS, RETURN WHAT WAS BORROWED. Hana realised that the science class had taken soil samples from the garden on Friday.","After the samples were returned, the clock slowed and stopped. The plants began growing normally again. Most vegetables were saved, although one pumpkin remained the size of a marble. Hana kept it as a reminder that even small actions can disturb a living system."],questions:[H("1. What first showed Hana that the garden was unusual?","A. The shed was locked","B. The plants were growing backwards","C. Mika found a clock","D. The science class arrived"),H("2. Where was the green clock?","A. Beneath the k\u016Bmara leaves","B. Inside the shed","C. Beside the classroom","D. Under a pumpkin"),H("3. Why did Hana stop Mika from pulling off the hands?","A. She wanted the clock","B. She thought forcing it might cause more damage","C. The clock was too hot","D. A teacher told her to stop"),H("4. Anticlockwise means\u2026","A. moving very slowly","B. moving opposite to a clock\u2019s hands","C. moving towards the sun","D. moving without stopping"),H("5. What had been borrowed from the garden?","A. Seeds","B. Tools","C. Soil samples","D. Vegetables"),H("6. What d ry by sacrificing another person\u2019s lifeline felt less like preservation and more like theft.","Instead of choosing, Iri wrote the forgotten names along the atlas edge. Silver ink divided into threads, reconnecting roads to the people who remembered them.","Iri invited families to add stories, photographs and names. As each memory was shared, another grey road regained its colour.","K\u014Dwhai Lane returned carrying handwritten notes from everyone who restored it. Iri understood that maps did more than show where people could go; they revealed what a community chose not to forget."],questions:[H("1. Why does K\u014Dwhai Lane begin disappearing?","A. A motorway is being built","B. People stopped remembering and valuing it","C. The cartographer closes it","D. Iri draws it incorrectly"),H("2. What is Iri\u2019s main conflict?","A. Whether to work in the shop","B. Whether to save one road by sacrificing another","C. Whether to visit her grandmother","D. Whether to sell the pen"),H("3. The grey dust most likely symbolises\u2026","A. traffic pollution","B. neglected memories and places","C. the cartographer\u2019s age","D. bad weather"),H("4. Why mention the hospital road?","A. To show erasing a road could cause real harm","B. To locate Iri\u2019s home","C. To introduce a doctor","D. To show the atlas is wrong"),H("5. Why does Iri reject the original rule?","A. She cannot use the pen","B. Preservation should not require harming others","C. She dislikes old roads","D. She wants blank maps"),H("6. What do the silver threads represent?","A. New motorways","B. Connections between shared memories","C. Cracks in the atlas","D. Hospital routes"),H("7. How does Iri solve the problem differently?","A. She hides the atlas","B. She shares responsibility with the community","C. She chooses one lane","D. She destroys the pen"),H("8. What does the final sentence suggest?","A. Maps are purely practical","B. Maps can reflect community values and memory","C. Maps should not have notes","D. Maps are more reliable than people"),H("9. What is the author\u2019s main purpose?","A. To explain mapmaking","B. To explore collective memory, responsibility and belonging","C. To oppose motorways","D. To describe a shop"),H("10. Which theme is strongest?","A. Important memories survive when communities protect them","B. One person should control decisions","C. New roads are always best","D. Forgetting helps progress")],vocabWords:["cartographer","sacrificing","preservation","lifeline","neglected","collective","reconnecting","valuing","burden","revealed"],vocabSteps:["Infer each meaning and record the context clue.","Check the definition and word class.","Add a synonym and label the connotation positive, negative or neutral.","Use five words in precise original sentences.","Choose one prefix or suffix and explain how it builds meaning."]}},N0={room5:{1:{title:"The Moon in the Mailbox",level:"Supported PAT practice: decoding, retrieval, sequence, vocabulary and prediction",image:"data:image/webp;base64,UklGRnjHAABXRUJQVlA4IGzHAAAwSQSdASqEA1gCPpVEnEqlo6KrpfN7+XASiWNsEqFjNl3eSds4S8UtlS14mmSPgp9iteXoAcZ+0Fz5PJb+4/8a6GKZen1i9/kqvJ/ol+68/fFfjU9L5x/vffE/8nrw/qnqO+bD1NecfzePVR/ffRj6rT0bumy/we//85/E/8h7Fe1pOFqv/+PHz+e/4//89SPGuQ85mP/x8433B7C5QKorUBfXy6wPWe5AZP4Q1p0z8IR3y88ezgdhtXI+JMY9rkUR+hxPpSb9HX9Lv/RZgf+NCGXzZgt/nNYgV1DN8b8l3BMn1W7PIw2zyFxJmu+K7u3q+GJHH4hHKbdSkV65Jjr6qT1jYJr0vLCl27SwQCKp++uwZzPx7n2ACrhduVPhXAW2T/aQHU2BuulzUvzvhd9f3fgAYMt9e9vm/uGY67gf/Icqkkv3P9uNdLsnBHz9zMeloLku09ji0mKwCJZ8EabNfci7/V/LoUBRbpu+XCzH2mJ0Zxm/mfNt6T7gvz9WnUB0UxUZKxwqtJMbxe0lUOlOLPD/Du5ajkPzsw+r6Ww7mooDh8uk48cE3kQW7uSnohx8xrziriU8GfaLsoIP6TrYwJvy0rteX4rrt8zxdAvy32GSXf25onUv4Z3sJWEvL8x7UwjG2UiwTWkGGKcIjXaKSpxMB10kKzakCthnjBjrWIpSWwKBBW2HbchE3DMWALWqKhEXTmCss5R3XcjUqqPKRjf98Ngz+Vg3L6LfOM9/0i4LyXrWatCeGkgcYG3jYSoRlVlbFMz2lDn508sJak0nz0hVrTl/V6pzbP9VLSJLSLjd6y3zGpry2UDU4eb9vCv0Tp6TFVmPPGOgQutNwx7PVLSes1s0l267bLTzEFbCLMyC2ggRG1DcWXh/uMDXGVifzdE2VIfaOB89mjuzg7TmkJui7e7rvfOTy4N+HxPC5zKR1DSqQ6c
